<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="100%" stop-color="#08090d" />
    </radialGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emerald-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Letter Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Inner Border Glow -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />

  <!-- Outer Subtle Stroke -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Ambient Glow Behind S -->
  <circle cx="256" cy="256" r="160" fill="url(#emerald-glow)" filter="url(#glow-blur)" />

  <!-- Inner Elevated Tile -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="#0d1117" stroke="url(#border-grad)" stroke-width="3" />

  <!-- Stylized Monogram S -->
  <path
    d="M336 188 C336 148 304 128 256 128 C204 128 172 152 172 192 C172 232 208 248 260 264 C316 280 344 300 344 340 C344 388 304 416 252 416 C192 416 156 384 156 336 L204 336 C204 360 224 376 252 376 C280 376 296 360 296 340 C296 316 272 304 224 288 C172 272 124 252 124 192 C124 144 164 88 256 88 C340 88 384 140 384 188 Z"
    fill="url(#emerald-grad)"
  />

  <!-- Active Consistency Dot -->
  <circle cx="340" cy="380" r="14" fill="#34d399" />
</svg>
